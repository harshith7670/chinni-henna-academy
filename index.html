<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinni Henna Academy</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}
header{background:#7b1e2b;text-align:center;padding:25px}
h2{text-align:center;color:#ffcc99;margin-top:30px}
.video-box{margin:15px;background:#222;padding:10px;border-radius:12px}
.video-box iframe{width:100%;height:220px;border:0;border-radius:10px}
button{background:#e07a5f;color:#fff;border:0;padding:10px 20px;border-radius:20px;cursor:pointer}
input,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:0}
#adminPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:99}
.admin-box{background:#fff;color:#000;max-width:450px;margin:30px auto;padding:20px;border-radius:12px}
.admin-box button{width:100%;background:#7b1e2b;margin-top:5px}
</style>
</head>
<body>
<header>
<h1>Chinni Henna Academy</h1>
<p>Basic to Bridal Mehndi Classes | Hyderabad</p>
</header>
<h2>ONLINE CLASS VIDEOS</h2>
<div id="onlineVideos"></div>
<h2>OFFLINE CLASS VIDEOS</h2>
<div id="offlineVideos"></div>
<h2>EVENTS VIDEOS</h2>
<div id="eventVideos"></div>
<div style="text-align:center;padding:20px;">
<a href="https://wa.me/917670000000" style="background:#25D366;color:#fff;padding:12px 25px;border-radius:25px;text-decoration:none;">Book on WhatsApp</a>
</div>
<footer style="text-align:center;padding:20px;background:#222;">
<p>Chinni Henna Academy - Hyderabad</p>
<button onclick="openAdmin()">Admin</button>
</footer>
<div id="adminPanel"><div class="admin-box">
<h2>Admin Panel</h2>
<input type="password" id="adminPass" placeholder="Password">
<button onclick="checkAdmin()">Login</button>
<div id="adminForm" style="display:none">
<input type="text" id="vTitle" placeholder="Video Title">
<select id="vType">
<option value="online">ONLINE CLASS VIDEOS</option>
<option value="offline">OFFLINE CLASS VIDEOS</option>
<option value="events">EVENTS VIDEOS</option>
</select>
<input type="text" id="vLink" placeholder="YouTube / Shorts Link">
<button onclick="addVideo()">Add Video</button>
<button onclick="closeAdmin()" style="background:#888">Close</button>
</div></div></div>
<script>
function openAdmin(){document.getElementById('adminPanel').style.display='block';}
function closeAdmin(){document.getElementById('adminPanel').style.display='none';}
function checkAdmin(){if(document.getElementById('adminPass').value==="chinni123"){document.getElementById('adminForm').style.display='block';alert("Login Success!");}else{alert("Wrong Password!");}}
function getYouTubeId(url){var m=url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([^&?\/ ]+)/);return m?m[1]:null;}
function loadVideos(){
var vids=JSON.parse(localStorage.getItem("chinniVideos")||"[]");
if(vids.length===0){vids=[{title:"Informational Video For Mehndi Artist",id:"zfXAivWo0YQ",type:"online"}];localStorage.setItem("chinniVideos",JSON.stringify(vids));}
var map={online:"onlineVideos",offline:"offlineVideos",events:"eventVideos"};
for(var t in map){var box=document.getElementById(map[t]);box.innerHTML="";vids.forEach(function(v,i){if(v.type!==t)return;var d=document.createElement("div");d.className="video-box";d.innerHTML='<iframe src="https://www.youtube.com/embed/'+v.id+'" allowfullscreen></iframe><p style="text-align:center;">'+v.title+'</p><button onclick="deleteVideo('+i+')" style="background:red;">Delete</button>';box.appendChild(d);});}
}
function addVideo(){var title=document.getElementById('vTitle').value||"New Video";var type=document.getElementById('vType').value;var id=getYouTubeId(document.getElementById('vLink').value);if(!id){alert("Correct Link pettu!");return;}var vids=JSON.parse(localStorage.getItem("chinniVideos")||"[]");vids.push({title:title,id:id,type:type});localStorage.setItem("chinniVideos",JSON.stringify(vids));loadVideos();alert("Video Save Ayyindhi!");}
function deleteVideo(i){var vids=JSON.parse(localStorage.getItem("chinniVideos")||"[]");vids.splice(i,1);localStorage.setItem("chinniVideos",JSON.stringify(vids));loadVideos();}
loadVideos();
</script>
</body>
</html>
